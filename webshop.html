<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gokart csapatruházat webshop – LSVT Powerteam</title>
<meta name="description" content="LSVT csapatruházat online: pólók, pulóverek, softshell kabátok, szerelőkesztyűk és kiegészítők felnőtteknek és gyerekeknek. Rendelj a gokart csapat webshopjából!">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32"><link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="canonical" href="https://ls-vt.hu/webshop">
<meta property="og:type" content="website"><meta property="og:locale" content="hu_HU"><meta property="og:site_name" content="LSVT Powerteam">
<meta property="og:title" content="Gokart csapatruházat webshop – LSVT Powerteam"><meta property="og:description" content="LSVT csapatruházat online: pólók, pulóverek, softshell kabátok, szerelőkesztyűk és kiegészítők felnőtteknek és gyerekeknek. Rendelj a gokart csapat webshopjából!">
<meta property="og:url" content="https://ls-vt.hu/webshop"><meta property="og:image" content="https://ls-vt.hu/assets/img/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/experience.css">
</head>
<body data-page="shop">
<div id="hdr"></div>

<div class="shop-hero"><div class="wrap">
  <div class="shop-intro"><h1><span class="eyebrow">Gokart csapatruházat webshop</span>Viseld a<br>csapatszellemet.</h1><p>A pálya mellett is LS_VT.<br>Csapatruházat és kiegészítők, kicsiknek és nagyoknak.</p></div>
  <div class="tools">
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="Keresés…" aria-label="Keresés">
    <select id="sort" aria-label="Rendezés"><option value="">Ajánlott</option><option value="asc">Ár szerint növekvő</option><option value="desc">Ár szerint csökkenő</option><option value="name">Név szerint</option></select>
  </div>
</div></div>

<section style="padding-top:10px"><div class="wrap">
  <p class="steps" id="count"></p>
  <div class="pgrid" id="grid"></div>
</div></section>

<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
const url = new URLSearchParams(location.search);
const CATS = ["Összes", "Női ruházat", "Férfi ruházat", "Gyerek ruházat", "Sport ruházat", "Kesztyű", "Kiegészítők"];
let cat = CATS.includes(url.get("k")) ? url.get("k") : "Összes";
const chips = document.getElementById("chips"), grid = document.getElementById("grid");
const q = document.getElementById("q"), sort = document.getElementById("sort");
function render() {
  chips.innerHTML = CATS.filter(c => c === "Összes" || LSVT.products.some(p => p.cats.includes(c)))
    .map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
  const s = q.value.trim().toLowerCase();
  let ps = LSVT.products.filter(p => (cat === "Összes" || p.cats.includes(cat)) && (!s || p.name.toLowerCase().includes(s)));
  if (sort.value === "asc") ps.sort((a, b) => a.price - b.price);
  if (sort.value === "desc") ps.sort((a, b) => b.price - a.price);
  if (sort.value === "name") ps.sort((a, b) => a.name.localeCompare(b.name, "hu"));
  document.getElementById("count").textContent = ps.length + " termék";
  grid.innerHTML = ps.length ? ps.map(LSVT.card).join("") : `<p class="empty">Nincs találat.</p>`;
}
chips.onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; cat = b.dataset.c;
  history.replaceState(null, "", cat === "Összes" ? "webshop.html" : "?k=" + encodeURIComponent(cat)); render(); };
q.oninput = sort.onchange = render;
LSVT.productsReady.then(() => { render(); const t = +url.get("termek"); if (t && LSVT.products.some(p => p.id === t)) LSVT.openProduct(t); });
</script>
<script src="assets/experience.js"></script></body>
</html>
